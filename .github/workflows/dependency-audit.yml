name: 依赖许可清单核对

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/check-dependency-audit.ps1'
      - 'docs/open-source/dependency-audit.csv'
      - 'backend/pom.xml'
      - 'simulator/pom.xml'
      - 'frontend/package-lock.json'
      - 'maven-settings.xml'
  pull_request:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/check-dependency-audit.ps1'
      - 'docs/open-source/dependency-audit.csv'
      - 'backend/pom.xml'
      - 'simulator/pom.xml'
      - 'frontend/package-lock.json'
      - 'maven-settings.xml'

permissions:
  contents: read

jobs:
  verify-inventory:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: 核对 Maven 与 npm 依赖许可清单
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          .\scripts\check-dependency-audit.ps1
